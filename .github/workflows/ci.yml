name: CI

# Comprehensive PR validation is intentionally gated until the human maintainer marks the PR ready for review.
on:
  pull_request:
    branches: [main]
    types: [converted_to_draft, opened, ready_for_review, synchronize, reopened]
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  quality-gate:
    name: quality-gate
    if: ${{ github.event_name == 'push' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install dependencies for formatting
        run: npm ci --no-audit --no-fund

      - name: Format UAT change candidates
        run: npx prettier --write docs/uat-script.md scripts/generate-uat-report.ts tests/unit/generate-uat-report.test.ts

      - name: Upload formatted UAT change candidates
        uses: actions/upload-artifact@v4
        with:
          name: uat-prettier-output
          path: |
            docs/uat-script.md
            scripts/generate-uat-report.ts
            tests/unit/generate-uat-report.test.ts

      - name: Run Village quality gate
        run: bash .github/scripts/village-ci.sh

      - name: Analyze application security
        uses: github/codeql-action/analyze@v4
