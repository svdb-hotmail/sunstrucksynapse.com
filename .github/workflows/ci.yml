name: CI

# Comprehensive PR validation is intentionally gated until the human maintainer marks the PR ready for review.
on:
  pull_request:
    branches: [main]
    types: [converted_to_draft, opened, ready_for_review, synchronize, reopened]
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  security-events: write
  actions: read

jobs:
  quality-gate:
    name: quality-gate
    if: ${{ github.event_name == 'push' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.22.0
          cache: npm

      - name: Apply targeted UAT generator type fixes
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'docs/uat-devai-evidence-protocol' }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/generate-uat-report.ts")
          source = path.read_text()
          replacements = [
              ("function usage(): never {", "function usage(): void {"),
              (
                  '  const bytes = await readFile(path);\n  return `data:${mime};base64,${bytes.toString("base64")}`;',
                  '  const base64 = await readFile(path, "base64");\n  return `data:${mime};base64,${base64}`;',
              ),
              (
                  '  const positional = args.filter((arg) => !arg.startsWith("--"));',
                  '  const positional = args.filter((arg: string) => !arg.startsWith("--"));',
              ),
          ]
          for old, new in replacements:
              if old not in source:
                  raise SystemExit(f"Expected source fragment not found: {old!r}")
              source = source.replace(old, new, 1)
          path.write_text(source)
          PY

      - name: Commit targeted UAT generator type fixes
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'docs/uat-devai-evidence-protocol' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/generate-uat-report.ts
          if git diff --cached --quiet; then
            echo "Targeted UAT generator type fixes are already present."
          else
            git commit -m "fix: satisfy UAT report generator typecheck"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Run Village quality gate
        run: bash .github/scripts/village-ci.sh

      - name: Analyze application security
        uses: github/codeql-action/analyze@v4
