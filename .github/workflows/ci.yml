name: CI

# Comprehensive PR validation is intentionally gated until the human maintainer marks the PR ready for review.
on:
  pull_request:
    branches: [main]
    types: [converted_to_draft, opened, ready_for_review, synchronize, reopened]
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  security-events: write
  actions: read

jobs:
  quality-gate:
    name: quality-gate
    if: ${{ github.event_name == 'push' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install dependencies for formatting
        run: npm ci --no-audit --no-fund

      - name: Format UAT change candidates
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'docs/uat-devai-evidence-protocol' }}
        run: npx prettier --write docs/uat-script.md scripts/generate-uat-report.ts tests/unit/generate-uat-report.test.ts

      - name: Commit canonical UAT formatting
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'docs/uat-devai-evidence-protocol' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/uat-script.md scripts/generate-uat-report.ts tests/unit/generate-uat-report.test.ts
          if git diff --cached --quiet; then
            echo "UAT files already match canonical Prettier output."
          else
            git commit -m "style: apply canonical Prettier output"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Run Village quality gate
        run: bash .github/scripts/village-ci.sh

      - name: Analyze application security
        uses: github/codeql-action/analyze@v4
