name: UAT formatter

on:
  push:
    branches:
      - docs/uat-devai-evidence-protocol

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: docs/uat-devai-evidence-protocol
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npx prettier --write scripts/generate-uat-report.ts tests/unit/generate-uat-report.test.ts
      - name: Commit canonical formatting
        run: |
          if git diff --quiet -- scripts/generate-uat-report.ts tests/unit/generate-uat-report.test.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/generate-uat-report.ts tests/unit/generate-uat-report.test.ts
          git commit -m "style: format UAT machinery"
          git push origin HEAD:docs/uat-devai-evidence-protocol
